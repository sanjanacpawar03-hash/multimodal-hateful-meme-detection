{% extends "base.html" %}
{% block title %}User Registration | Hateful Meme Detection{% endblock %}

{% block content %}
<section class="d-flex align-items-center justify-content-center py-5"
         style="min-height: calc(100vh - 140px);
                background: linear-gradient(135deg, #f3effc, #e2d9f3);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">

        <div class="main-block border-0">

          <!-- Header -->
          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:70px; height:70px; border-radius:50%;
                        background: linear-gradient(45deg, #6f42c1, #8e63ce);">
              <i class="fas fa-user-plus fa-2x text-white"></i>
            </div>
            <h3 class="fw-bold text-primary">Create Account</h3>
            <p class="text-muted mb-0">Join the Hateful Meme Detection System</p>
          </div>

          <!-- Registration Form -->
          <form method="post" action="{{ url_for('userregistration') }}">

            <!-- Full Name -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-primary">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light-purple border-0">
                  <i class="fas fa-user text-primary"></i>
                </span>
                <input type="text"
                       class="form-control border-0 shadow-sm"
                       name="name"
                       placeholder="Enter your full name"
                       required>
              </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-primary">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light-purple border-0">
                  <i class="fas fa-envelope text-primary"></i>
                </span>
                <input type="email"
                       class="form-control border-0 shadow-sm"
                       name="email"
                       placeholder="Enter your email"
                       required>
              </div>
            </div>

            <!-- Mobile -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-primary">Mobile Number</label>
              <div class="input-group">
                <span class="input-group-text bg-light-purple border-0">
                  <i class="fas fa-phone text-primary"></i>
                </span>
                <input type="tel"
                       class="form-control border-0 shadow-sm"
                       name="mobile"
                       pattern="[0-9]{10,15}"
                       placeholder="Enter mobile number"
                       required>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label fw-semibold text-primary">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light-purple border-0">
                  <i class="fas fa-lock text-primary"></i>
                </span>
                <input type="password"
                       class="form-control border-0 shadow-sm"
                       name="password"
                       placeholder="Create a password"
                       required>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-4">
              <label class="form-label fw-semibold text-primary">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light-purple border-0">
                  <i class="fas fa-lock text-primary"></i>
                </span>
                <input type="password"
                       class="form-control border-0 shadow-sm"
                       name="confirm_password"
                       placeholder="Confirm your password"
                       required>
              </div>
            </div>

            <!-- Submit -->
            <button type="submit"
                    class="btn btn-primary w-100 py-2 fw-bold">
              <i class="fas fa-user-plus me-2"></i> Register
            </button>
          </form>

          <!-- Alerts -->
         {% if msg %}
<div class="alert alert-{{ msg_type }} mt-3 text-center">
  {{ msg }}
</div>
{% endif %}


          <!-- Footer -->
          <div class="text-center mt-4">
            <span class="text-muted">Already have an account?</span>
            <a href="{{ url_for('userlogin') }}" class="fw-bold text-primary ms-1">
              Login
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
