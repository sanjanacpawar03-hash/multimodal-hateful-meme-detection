{% extends 'User/Userbase.html' %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4 text-purple">Frequently Asked Questions</h2>

    {% if msg %}
        <div class="alert alert-warning">{{ msg }}</div>
    {% endif %}

    {% if faqs %}
        <div class="accordion" id="faqAccordion">
            {% for faq in faqs %}
                <div class="accordion-item border-0 mb-3 shadow-sm">
                    <h2 class="accordion-header" id="heading{{ loop.index }}">
                        <button class="accordion-button {% if not loop.first %}collapsed{% endif %} fw-bold" 
                                type="button" 
                                data-bs-toggle="collapse" 
                                data-bs-target="#collapse{{ loop.index }}" 
                                aria-expanded="{{ 'true' if loop.first else 'false' }}" 
                                aria-controls="collapse{{ loop.index }}"
                                style="background: linear-gradient(90deg, #7b1fa2 0%, #9575cd 100%); color: #fff;">
                            {{ faq.question }}
                        </button>
                    </h2>
                    <div id="collapse{{ loop.index }}" 
                         class="accordion-collapse collapse {% if loop.first %}show{% endif %}" 
                         aria-labelledby="heading{{ loop.index }}" 
                         data-bs-parent="#faqAccordion">
                        <div class="accordion-body bg-purple-light">
                            {{ faq.answer }}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <div class="text-center py-5">
            <i class="fas fa-question-circle fa-3x text-purple mb-3"></i>
            <p class="text-muted">No FAQs available at the moment.</p>
        </div>
    {% endif %}
</div>

<style>
    .accordion-button:not(.collapsed) {
        background: linear-gradient(90deg, #6a1b9a 0%, #7e57c2 100%);
        color: #fff;
        box-shadow: inset 0 -1px 0 rgba(0,0,0,0.125);
    }
    .accordion-button:focus {
        border-color: #7b1fa2;
        box-shadow: 0 0 0 0.25rem rgba(123, 31, 162, 0.25);
    }
    .accordion-body {
        background: #f5f5f5;
        border-left: 3px solid #7b1fa2;
    }
</style>
{% endblock %}
