<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin Dashboard - Hateful Meme Detection System{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body {
      background: linear-gradient(120deg, #ede7f6 0%, #d1c4e9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    nav.navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1030;
      background: linear-gradient(90deg, #4a2d7e 0%, #6f42c1 100%) !important;
      box-shadow: 0 2px 12px rgba(74, 45, 126, 0.2);
    }

    nav.navbar .navbar-brand,
    nav.navbar .nav-link {
      color: #fff !important;
    }

    #sidebar {
      position: fixed;
      top: 56px;
      left: 0;
      height: calc(100vh - 56px);
      width: 220px;
      background: #ede7f6;
      border-right: 2px solid #6f42c1;
      padding-top: 1rem;
      transition: all 0.3s;
      z-index: 1020;
      box-shadow: 2px 0 18px rgba(0, 0, 0, 0.08);
    }

    #sidebar .nav-link {
      color: #4a2d7e;
      font-weight: 500;
      border-radius: 0.5rem;
      margin-bottom: 0.25rem;
    }

    #sidebar .nav-link.active,
    #sidebar .nav-link:hover {
      background: linear-gradient(90deg, #4a2d7e 0%, #6f42c1 100%);
      color: #fff !important;
    }

    #content {
      margin-top: 56px;
      margin-left: 220px;
      padding: 2rem;
      min-height: calc(100vh - 56px);
    }

    @media (max-width: 991px) {
      #sidebar {
        left: -220px;
      }
      #sidebar.active {
        left: 0;
      }
      #content {
        margin-left: 0;
      }
      #sidebarToggle {
        display: inline-block;
      }
    }

    #sidebarToggle {
      display: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      margin-right: 1rem;
    }

    footer {
      background: linear-gradient(90deg, #4a2d7e 0%, #6f42c1 100%);
      color: #fff;
      text-align: center;
      padding: 0.75rem;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <span id="sidebarToggle" class="d-lg-none"><i class="fas fa-bars"></i></span>
      <a class="navbar-brand fw-bold" href="{{ url_for('adminhome') }}">
        <i class="fas fa-user-shield me-2"></i>Meme Detector Admin
      </a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('adminlogout') }}">
            <i class="fas fa-sign-out-alt me-1"></i> Logout
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Sidebar -->
  <nav id="sidebar">
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link {% if request.endpoint == 'adminhome' %}active{% endif %}"
           href="{{ url_for('adminhome') }}">
          <i class="fas fa-chart-line me-2"></i> Dashboard
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if request.endpoint == 'adminusers' %}active{% endif %}"
           href="{{ url_for('adminusers') }}">
          <i class="fas fa-users me-2"></i> Users
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if request.endpoint == 'admin_queries' %}active{% endif %}"
           href="{{ url_for('admin_queries') }}">
          <i class="fas fa-comments me-2"></i> User Queries
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link {% if request.endpoint == 'adminfaq' %}active{% endif %}"
           href="{{ url_for('adminfaq') }}">
          <i class="fas fa-question-circle me-2"></i> FAQ
        </a>
      </li>
    </ul>
  </nav>

  <!-- Content -->
  <main id="content">
    {% if msg %}
      <div class="alert alert-{{ msg_type }} text-center">{{ msg }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; 2025 Hateful Meme Detection System
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    if (sidebarToggle) {
      sidebarToggle.onclick = () => sidebar.classList.toggle('active');
    }
  </script>

</body>
</html>
